services:
  postgres:
    image: postgres:18-alpine
    container_name: poplist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poplist
      POSTGRES_USER: poplist
      POSTGRES_PASSWORD: poplist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poplist -d poplist"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
